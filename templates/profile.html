{% extends "base.html" %}
{% block title %}操作动态 - AI Interview Agent{% endblock %}
{% block content %}
<div class="row mb-4">
    <div class="col">
        <h4 class="mb-1"><i class="bi bi-clock-history me-2"></i>操作动态</h4>
        <p class="text-muted small mb-0">记录账号登录、改密改名、以及面试官的面试记录（创建/结束/删除面试，标注第几轮）</p>
    </div>
</div>

<!-- 筛选栏：两级联动下拉（对象大类 → 子操作） -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <label class="small text-muted me-1">用户</label>
                <select id="filterUser" class="form-select form-select-sm" style="width:140px" onchange="loadLogs(1)">
                    <option value="">所有人</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="small text-muted me-1">对象</label>
                <select id="filterCategory" class="form-select form-select-sm" style="width:140px" onchange="onCategoryChange()">
                    <option value="">全部对象</option>
                    <option value="user">账户</option>
                    <option value="interview_session">面试</option>
                    <option value="position">岗位</option>
                    <option value="candidate">候选人</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="small text-muted me-1">操作</label>
                <select id="filterAction" class="form-select form-select-sm" style="width:140px" onchange="loadLogs(1)">
                    <option value="">全部操作</option>
                </select>
            </div>
            <div class="col-auto ms-auto">
                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise me-1"></i>重置</button>
            </div>
        </div>
    </div>
</div>

<!-- 日志列表 -->
<div id="logList" class="list-group mb-3">
    <div class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>加载中...
    </div>
</div>

<!-- 分页 -->
<nav id="pagination" class="d-flex justify-content-between align-items-center" style="display:none!important">
    <small class="text-muted" id="pageInfo"></small>
    <div>
        <button class="btn btn-outline-secondary btn-sm" id="prevBtn" onclick="loadLogs(currentPage-1)">上一页</button>
        <button class="btn btn-outline-secondary btn-sm" id="nextBtn" onclick="loadLogs(currentPage+1)">下一页</button>
    </div>
</nav>

<script>
let currentPage = 1;
let totalPages = 1;

// 各类对象对应的子操作（key = target_type）
const SUB_ACTIONS = {
    user: [
        { action: 'login',            label: '登录成功' },
        { action: 'login_fail',       label: '登录失败' },
        { action: 'logout',           label: '登出' },
        { action: 'change_password',  label: '改密码' },
        { action: 'change_username',  label: '改名' },
    ],
    interview_session: [
        { action: 'create',           label: '创建' },
        { action: 'finish_interview', label: '结束面试' },
        { action: 'delete',           label: '删除' },
    ],
    position: [
        { action: 'create',  label: '创建' },
        { action: 'delete',  label: '删除' },
        { action: 'analyze', label: 'AI分析' },
    ],
    candidate: [
        { action: 'create',  label: '创建' },
        { action: 'delete',  label: '删除' },
        { action: 'analyze', label: 'AI分析' },
    ],
};

// 操作类型映射（与后端 log_operation 第一个参数保持一致）
const ACTION_MAP = {
    login:            { label: '登录成功', icon: 'bi-box-arrow-in-right', color: 'success' },
    login_fail:       { label: '登录失败', icon: 'bi-shield-x',           color: 'danger' },
    logout:           { label: '登出',     icon: 'bi-box-arrow-left',     color: 'secondary' },
    create:           { label: '创建',     icon: 'bi-plus-circle',        color: 'primary' },
    finish_interview: { label: '结束面试', icon: 'bi-check-circle',       color: 'success' },
    delete:           { label: '删除',     icon: 'bi-trash',               color: 'danger' },
    analyze:          { label: 'AI分析',   icon: 'bi-robot',               color: 'info' },
    change_password:  { label: '改密码',   icon: 'bi-key',                 color: 'warning' },
    change_username:  { label: '改名',     icon: 'bi-person-badge',       color: 'warning' },
};

const TARGET_MAP = {
    user:             '用户',
    interview_session:'面试会话',
    candidate:        '候选人',
    position:         '岗位',
};

function actionBadge(action) {
    const m = ACTION_MAP[action] || { label: action, icon: 'bi-activity', color: 'secondary' };
    return `<span class="badge bg-${m.color}"><i class="bi ${m.icon} me-1"></i>${m.label}</span>`;
}

function targetLabel(log) {
    const t = TARGET_MAP[log.target_type] || log.target_type || '';
    const name = log.target_name || '';
    if (t && name) return `${t}「${name}」`;
    if (name) return `「${name}」`;
    return t;
}

function renderLogs(logs) {
    const el = document.getElementById('logList');
    if (!logs.length) {
        el.innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-inbox me-2"></i>暂无操作记录</div>';
        return;
    }
    el.innerHTML = logs.map(log => `
        <div class="list-group-item d-flex align-items-start gap-2 py-2 px-3">
            <div class="flex-shrink-0 mt-1">${actionBadge(log.action)}</div>
            <div class="flex-grow-1">
                <div>
                    <strong>${log.username}</strong>
                    <span class="text-muted">${targetLabel(log)}</span>
                </div>
                ${log.detail ? `<div class="small text-muted mt-1">${log.detail}</div>` : ''}
            </div>
            <div class="flex-shrink-0 text-muted small">${log.created_at || ''}</div>
        </div>
    `).join('');
}

async function loadLogs(page) {
    if (page < 1) return;
    currentPage = page;

    const params = new URLSearchParams({ page, per_page: 50 });
    const userId = document.getElementById('filterUser').value;
    const targetType = document.getElementById('filterCategory').value;
    const action = document.getElementById('filterAction').value;
    if (userId) params.set('user_id', userId);
    if (targetType) params.set('target_type', targetType);
    if (action) params.set('action', action);

    document.getElementById('logList').innerHTML = '<div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>加载中...</div>';

    try {
        const resp = await fetch('/api/audit/logs?' + params.toString());
        const data = await resp.json();
        const result = data.data || {};

        renderLogs(result.logs || []);
        totalPages = result.pages || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页，共 ${result.total || 0} 条`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        document.getElementById('pagination').style.display = (result.total > 0) ? '' : 'none';
        document.getElementById('pagination').style.setProperty('display', (result.total > 0) ? '' : 'none', 'important');
    } catch (e) {
        document.getElementById('logList').innerHTML = `<div class="text-center py-4 text-danger">加载失败: ${e.message}</div>`;
    }
}

async function loadUsers() {
    try {
        const resp = await fetch('/api/audit/users');
        const data = await resp.json();
        const sel = document.getElementById('filterUser');
        (data.data || []).forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.username;
            sel.appendChild(opt);
        });
    } catch (e) { /* ignore */ }
}

// 对象大类变化时，重置子操作下拉
function onCategoryChange() {
    const cat = document.getElementById('filterCategory').value;
    const sel = document.getElementById('filterAction');
    sel.innerHTML = '<option value="">全部操作</option>';
    if (cat && SUB_ACTIONS[cat]) {
        for (const item of SUB_ACTIONS[cat]) {
            const opt = document.createElement('option');
            opt.value = item.action;
            opt.textContent = item.label;
            sel.appendChild(opt);
        }
    }
    loadLogs(1);
}

function resetFilters() {
    document.getElementById('filterUser').value = '';
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterAction').innerHTML = '<option value="">全部操作</option>';
    loadLogs(1);
}

// 初始化
loadUsers();
loadLogs(1);
</script>
{% endblock %}
