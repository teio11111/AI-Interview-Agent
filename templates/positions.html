{% extends "base.html" %}
{% block title %}岗位管理 - AI Interview Agent{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-briefcase"></i> 岗位管理</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
        <i class="bi bi-plus-lg"></i> 新建岗位
    </button>
</div>

<!-- 岗位列表 -->
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>岗位名称</th>
                    <th>技术要求</th>
                    <th>AI 分析</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="positionList"></tbody>
        </table>
        <div id="emptyState" class="text-center py-5 d-none">
            <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
            <p class="text-muted mt-2">暂无岗位，点击"新建岗位"开始</p>
        </div>
    </div>
</div>

<!-- 新建岗位弹窗（同时支持手动录入 + PDF 智能导入两种方式） -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新建岗位</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- 快捷入口：PDF 智能导入（默认折叠，需要时展开） -->
                <div class="mb-3">
                    <button class="btn btn-outline-primary btn-sm w-100" type="button" data-bs-toggle="collapse" data-bs-target="#pdfImportBox" aria-expanded="false">
                        <i class="bi bi-magic me-1"></i>从 PDF 智能导入（AI 自动识别后弹出预览界面供你确认）
                    </button>
                    <div class="collapse mt-2" id="pdfImportBox">
                        <div class="card card-body bg-light">
                            <div class="mb-2">
                                <input type="file" class="form-control form-control-sm" id="pdfFile" accept=".pdf">
                            </div>
                            <button class="btn btn-primary btn-sm w-100" type="button" id="btnParseJd" onclick="parseJd()">
                                <i class="bi bi-magic me-1"></i>AI 识别岗位
                            </button>
                        </div>
                    </div>
                </div>

                <hr class="my-3">

                <!-- 手动填写表单 -->
                <div class="mb-3">
                    <label class="form-label">岗位名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="newName" placeholder="如：Python后端开发">
                </div>
                <div class="mb-3">
                    <label class="form-label">JD 内容</label>
                    <textarea class="form-control" id="newJd" rows="4" placeholder="职位描述、职责要求..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">技术要求</label>
                    <input type="text" class="form-control" id="newTech" placeholder="用逗号分隔，如：Python,Flask,MySQL">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="btnCreate" onclick="createPosition()">创建</button>
            </div>
        </div>
    </div>
</div>

<!-- 识别预览确认弹窗（独立界面，面试官可修改任意字段后导入） -->
<div class="modal fade" id="previewModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span class="badge badge-ai me-2"><i class="bi bi-robot"></i> AI</span>识别结果预览 · 请确认后导入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning py-2 small mb-3">
                    <i class="bi bi-exclamation-triangle me-1"></i>识别结果可能不完整，面试官可在下方<strong>任意修改</strong>后再确认导入。
                </div>
                <div class="mb-3">
                    <label class="form-label">岗位名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="previewName" placeholder="如：Python后端开发">
                </div>
                <div class="mb-3">
                    <label class="form-label">JD 内容</label>
                    <textarea class="form-control" id="previewJd" rows="6" placeholder="职位描述、职责要求..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">技术要求 <small class="text-muted">(逗号分隔)</small></label>
                    <input type="text" class="form-control" id="previewTech" placeholder="如：Python,FastAPI,MySQL">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="backToUpload()">
                    <i class="bi bi-arrow-left me-1"></i>返回重新上传
                </button>
                <button class="btn btn-primary" type="button" id="btnConfirmCreate" onclick="confirmCreatePosition()">
                    <i class="bi bi-check-lg me-1"></i>确认导入
                </button>
            </div>
        </div>
    </div>
</div>

<!-- AI 分析结果弹窗 -->
<div class="modal fade" id="aiModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span class="badge badge-ai me-2"><i class="bi bi-robot"></i> AI</span>岗位分析结果</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="aiResult"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
async function loadPositions() {
    const res = await apiCall('/api/positions');
    const list = document.getElementById('positionList');
    const empty = document.getElementById('emptyState');
    
    if (!res.data || res.data.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('d-none');
        return;
    }
    
    // 存储岗位数据供查看按钮使用
    window._positionsData = {};
    res.data.forEach(p => { window._positionsData[p.id] = p; });
    
    empty.classList.add('d-none');
    list.innerHTML = res.data.map(p => `
        <tr>
            <td>${p.id}</td>
            <td><strong>${p.name}</strong></td>
            <td><span class="text-muted">${p.tech_requirements || '-'}</span></td>
            <td>
                ${p.ai_analysis 
                    ? `<button class="btn btn-sm btn-outline-primary" onclick="showAiResultById(${p.id})"><i class="bi bi-eye"></i> 查看</button>
                       <button class="btn btn-sm btn-outline-secondary ms-1" onclick="analyzePosition(${p.id}, this)"><i class="bi bi-arrow-repeat"></i> 重新分析</button>`
                    : `<button class="btn btn-sm btn-outline-secondary" onclick="analyzePosition(${p.id}, this)"><i class="bi bi-robot"></i> AI分析</button>`
                }
            </td>
            <td><small class="text-muted">${p.created_at}</small></td>
            <td>
                <button class="btn btn-sm btn-outline-danger" onclick="deletePosition(${p.id})"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

async function parseJd() {
    const btn = document.getElementById('btnParseJd');
    const fileInput = document.getElementById('pdfFile');
    const hasFile = fileInput.files && fileInput.files.length > 0;

    if (!hasFile) {
        showToast('请先选择 PDF 文件', 'warning');
        return;
    }

    setLoading(btn, true);
    try {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const r = await fetch('/api/positions/parse-jd', {
            method: 'POST',
            body: formData,
        });
        const res = await r.json();

        if (res.code !== 0 && res.code !== 200) {
            showToast(res.message || '识别失败', 'danger');
            return;
        }

        const { name, jd_content, tech_requirements } = res.data;
        // 填充预览弹窗
        document.getElementById('previewName').value = name || '';
        document.getElementById('previewJd').value = jd_content || '';
        document.getElementById('previewTech').value = tech_requirements || '';

        // 关闭上传弹窗 → 打开预览弹窗
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        const previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
        previewModal.show();

        showToast(`识别完成，共识别到 ${(tech_requirements || '').split(',').filter(s => s.trim()).length} 项技术要求`);
    } catch (e) {
        showToast('请求失败：' + e.message, 'danger');
    } finally {
        setLoading(btn, false);
    }
}

function backToUpload() {
    // 预览返回上传：关闭预览，重新打开上传弹窗（保留已选 PDF）
    bootstrap.Modal.getInstance(document.getElementById('previewModal')).hide();
    setTimeout(() => new bootstrap.Modal(document.getElementById('addModal')).show(), 200);
}

// 手动录入路径：从 addModal 三个字段直接创建
async function createPosition() {
    const name = document.getElementById('newName').value.trim();
    if (!name) { showToast('请输入岗位名称', 'warning'); return; }

    const btn = document.getElementById('btnCreate');
    setLoading(btn, true);

    const res = await apiCall('/api/positions', 'POST', {
        name,
        jd_content: document.getElementById('newJd').value,
        tech_requirements: document.getElementById('newTech').value
    });

    setLoading(btn, false);

    if (res.code === 201) {
        showToast('岗位创建成功');
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('newName').value = '';
        document.getElementById('newJd').value = '';
        document.getElementById('newTech').value = '';
        loadPositions();
    } else {
        showToast(res.message, 'danger');
    }
}

async function confirmCreatePosition() {
    const name = document.getElementById('previewName').value.trim();
    if (!name) { showToast('请输入岗位名称', 'warning'); return; }

    const btn = document.getElementById('btnConfirmCreate');
    setLoading(btn, true);

    const res = await apiCall('/api/positions', 'POST', {
        name,
        jd_content: document.getElementById('previewJd').value,
        tech_requirements: document.getElementById('previewTech').value
    });

    setLoading(btn, false);

    if (res.code === 201) {
        showToast('岗位导入成功');
        bootstrap.Modal.getInstance(document.getElementById('previewModal')).hide();
        // 重置上传弹窗（供下次使用）
        const fileInput = document.getElementById('pdfFile');
        if (fileInput) fileInput.value = '';
        document.getElementById('previewName').value = '';
        document.getElementById('previewJd').value = '';
        document.getElementById('previewTech').value = '';
        loadPositions();
    } else {
        showToast(res.message, 'danger');
    }
}

async function analyzePosition(id, btn) {
    consumeSSE(`/api/stream/position/${id}`, {
        method: 'GET',
        initialMsg: 'AI 正在分析岗位要求...',
        initialSub: '正在解析岗位 JD 并提取技术能力模型，请稍候',
        async onComplete(payload) {
            await loadPositions();
            showToast('AI 分析完成');
            showAiResult(payload.result);
        }
    });
}

function showAiResultById(id) {
    const p = window._positionsData[id];
    if (!p || !p.ai_analysis) {
        showToast('暂无分析结果', 'warning');
        return;
    }
    showAiResult(p.ai_analysis);
}

function showAiResult(analysis) {
    const data = typeof analysis === 'string' ? JSON.parse(analysis) : analysis;
    
    // 构建岗位洞察 HTML
    const insights = data.position_insights || {};
    const implicit = data.implicit_requirements || {};
    
    let insightsHtml = '';
    if (Object.keys(insights).length > 0) {
        insightsHtml = `
        <div class="mt-3">
            <h6><i class="bi bi-eye me-1 text-primary"></i>岗位真实需求解读</h6>
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">本质需求</div>
                        <div>${insights.real_need || '-'}</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">团队文化</div>
                        <div><span class="badge bg-info">${insights.team_culture || '-'}</span></div>
                        <div class="text-muted mt-1">${insights.culture_detail || ''}</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">成长路径</div>
                        <div>${insights.growth_path || '-'}</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">理想候选人</div>
                        <div>${insights.ideal_candidate || '-'}</div>
                    </div>
                </div>
            </div>
        </div>`;
    }
    
    const levelBadge = (level) => {
        if (!level) return '<span class="text-muted">-</span>';
        const colors = { '高': 'danger', '中': 'warning', '低': 'success' };
        return `<span class="badge bg-${colors[level] || 'secondary'}">${level}</span>`;
    };
    
    let implicitHtml = '';
    if (Object.keys(implicit).length > 0) {
        const stress = implicit.stress_tolerance || {};
        const mgmt = implicit.management_potential || {};
        const comm = implicit.communication_complexity || {};
        const stab = implicit.stability_expectation || {};
        const edu = implicit.education_preference || {};
        
        implicitHtml = `
        <div class="mt-3">
            <h6><i class="bi bi-shield-lock me-1 text-warning"></i>隐性条件需求</h6>
            <div class="row g-2">
                <div class="col-md-4">
                    <div class="p-2 bg-light rounded small text-center">
                        <div class="text-muted mb-1">抗压能力</div>
                        <div>${levelBadge(stress.level)}</div>
                        <div class="text-muted mt-1" style="font-size:0.75rem;">${stress.detail || ''}</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-2 bg-light rounded small text-center">
                        <div class="text-muted mb-1">管理潜力</div>
                        <div><span class="badge bg-${mgmt.needed ? 'primary' : 'secondary'}">${mgmt.needed ? '需要' : '纯IC'}</span></div>
                        <div class="text-muted mt-1" style="font-size:0.75rem;">${mgmt.detail || ''}</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-2 bg-light rounded small text-center">
                        <div class="text-muted mb-1">沟通复杂度</div>
                        <div>${levelBadge(comm.level)}</div>
                        <div class="text-muted mt-1" style="font-size:0.75rem;">${comm.detail || ''}</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">稳定性要求</div>
                        <div>${levelBadge(stab.level)} ${stab.detail || ''}</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-2 bg-light rounded small">
                        <div class="fw-bold mb-1">学历偏好</div>
                        <div>明确: ${edu.explicit || '无'} | 隐性: ${edu.implicit || '无'}</div>
                        <div class="text-muted mt-1" style="font-size:0.75rem;">${edu.detail || ''}</div>
                    </div>
                </div>
            </div>
        </div>`;
    }
    
    document.getElementById('aiResult').innerHTML = `
        <div class="ai-result">
            <h6><i class="bi bi-stars me-1"></i>分析摘要</h6>
            <p>${data.summary || '-'}</p>
            
            <h6 class="mt-3"><i class="bi bi-gear me-1"></i>核心技能</h6>
            <div>${(data.core_skills || []).map(s => {
                const name = typeof s === 'string' ? s : s.skill;
                const imp = typeof s === 'object' ? s.importance : '';
                const cls = imp === '必须' ? 'danger' : imp === '重要' ? 'warning' : 'info';
                return `<span class="badge bg-${cls} me-1 mb-1">${name}${imp ? ' ('+imp+')' : ''}</span>`;
            }).join('')}</div>
            
            <h6 class="mt-3"><i class="bi bi-bar-chart me-1"></i>经验要求</h6>
            <p>${data.experience_level || '-'}${data.experience_years ? ' (' + data.experience_years + ')' : ''}</p>
            
            <h6 class="mt-3"><i class="bi bi-bullseye me-1"></i>面试重点</h6>
            <ul>${(data.interview_focus || []).map(f => {
                const topic = typeof f === 'string' ? f : f.topic;
                const desc = typeof f === 'object' && f.description ? ' - ' + f.description : '';
                return `<li>${topic}${desc}</li>`;
            }).join('')}</ul>
            
            <h6 class="mt-3"><i class="bi bi-lightbulb me-1"></i>推荐考察内容</h6>
            <ul>${(data.recommended_topics || []).map(t => `<li>${t}</li>`).join('')}</ul>
        </div>
        ${insightsHtml}
        ${implicitHtml}
    `;
    new bootstrap.Modal(document.getElementById('aiModal')).show();
}

async function deletePosition(id) {
    if (!confirm('确定删除该岗位？')) return;
    const res = await apiCall(`/api/positions/${id}`, 'DELETE');
    if (res.code === 200) {
        showToast('删除成功');
        loadPositions();
    } else {
        showToast(res.message, 'danger');
    }
}

loadPositions();
</script>
{% endblock %}
