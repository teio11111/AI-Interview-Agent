<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Interview Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .tab-btn {
            border: none; background: none; padding: 0.85rem;
            width: 50%; font-weight: 600; color: #94a3b8;
            border-bottom: 3px solid transparent; cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; }
        .tab-btn:hover:not(.active) { color: #475569; }
        .form-section { padding: 1.5rem 2rem 2rem; }
        .btn-auth {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none; padding: 0.7rem; font-weight: 600;
        }
        .btn-auth:hover { background: linear-gradient(135deg, #4338ca, #6d28d9); }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-robot" style="font-size:2.5rem;"></i>
            <h4 class="mt-2 mb-1">AI Interview Agent</h4>
            <small class="opacity-75">管理员控制台</small>
        </div>

        <!-- 管理员登录 -->
        <div class="form-section" id="adminForm">
            <div class="mb-3">
                <label class="form-label fw-bold">用户名</label>
                <input type="text" class="form-control" id="adminUser" placeholder="管理员账号">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">密码</label>
                <input type="password" class="form-control" id="adminPass" placeholder="密码">
            </div>
            <button class="btn btn-primary btn-auth w-100 text-white" id="adminBtn" onclick="doLogin('admin')">
                <i class="bi bi-box-arrow-in-right me-1"></i> 登 录
            </button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showToast(msg, type = 'danger') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast align-items-center text-bg-${type} border-0 show`;
            t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function setLoading(btn, on) {
            if (on) {
                btn.disabled = true;
                btn.dataset.orig = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.orig || btn.innerHTML;
            }
        }

        function switchTab(tab) {
            // 保留函数避免历史书签引用报错，实际不再使用
        }

        async function doLogin(role) {
            const btn = document.getElementById('adminBtn');
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value;
            if (!user || !pass) return showToast('请填写用户名和密码');
            setLoading(btn, true);
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                }).then(r => r.json());
                setLoading(btn, false);
                if (res.code === 200) {
                    window.location.href = res.data.redirect;
                } else {
                    showToast(res.message || '登录失败');
                }
            } catch (e) {
                setLoading(btn, false);
                showToast('网络错误');
            }
        }

        // Enter 键提交
        document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin('admin'); });
    </script>
</body>
</html>
